<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KRODOSEN 管理后台</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="img/logo.png">
<link rel="stylesheet" href="assets/css/admin.css">
</head>
<body class="adm">

<!-- ============ LOGIN ============ -->
<div class="login" id="loginView">
  <form class="login__box" id="loginForm" autocomplete="off">
    <div class="login__logo"><img src="img/logo.png" alt="KRODOSEN"></div>
    <h1>管理后台</h1>
    <p class="login__sub">Content &amp; catalogue console</p>
    <label class="fld">
      <span>密码 Password</span>
      <input type="password" id="loginPw" required autocomplete="current-password">
    </label>
    <button type="submit" class="btn btn--primary btn--block">登 录</button>
    <p class="login__msg" id="loginMsg" hidden></p>
    <p class="login__hint">默认密码 <code>krodosen2026</code>，可在 <code>assets/js/cms-config.js</code> 修改。</p>
  </form>
</div>

<!-- ============ SHELL ============ -->
<div class="shell" id="shellView" hidden>
  <aside class="side">
    <div class="side__brand">
      <img src="img/logo-rev.png" alt="KRODOSEN">
      <span>Console</span>
    </div>

    <nav class="side__nav">
      <button class="side__link is-on" data-view="products">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2.5" y="3.5" width="15" height="5"/><rect x="2.5" y="11.5" width="15" height="5"/></svg>
        <span>产品管理</span><i data-badge-products>0</i>
      </button>
      <button class="side__link" data-view="content">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4h14M3 8h9M3 12h14M3 16h7"/></svg>
        <span>页面装修</span>
      </button>
      <button class="side__link" data-view="inquiries">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2.5" y="4.5" width="15" height="11" rx="1.5"/><path d="M3 6l7 5 7-5"/></svg>
        <span>询盘消息</span><i class="i--alert" data-badge-inq>0</i>
      </button>
    </nav>

    <div class="side__foot">
      <div class="mode" data-mode-badge>本地模式</div>
      <a class="side__mini" href="index.html" target="_blank" rel="noopener">查看网站 ↗</a>
      <button class="side__mini" id="logoutBtn">退出登录</button>
    </div>
  </aside>

  <main class="main">
    <header class="top">
      <div>
        <h2 id="viewTitle">产品管理</h2>
        <p id="viewSub" class="top__sub"></p>
      </div>
      <div class="top__act" id="viewActions"></div>
    </header>

    <!-- ---------- PRODUCTS ---------- -->
    <section class="view" id="view-products">
      <div class="bar">
        <div class="search">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="4.6"/><path d="M10.6 10.6 14 14"/></svg>
          <input type="search" id="prodSearch" placeholder="搜索型号 / 分类 / 子类 / 参数">
        </div>
        <select id="prodCat" class="sel"><option value="all">全部分类</option></select>
        <button class="btn" id="addProd">＋ 新增产品</button>
        <button class="btn btn--ghost" id="resetProds">重置为示例数据</button>
      </div>

      <div class="tblwrap">
        <table class="tbl">
          <thead>
            <tr>
              <th class="w-img">图片</th>
              <th>型号</th>
              <th>分类 / 子类</th>
              <th>封装</th>
              <th>价格</th>
              <th>状态</th>
              <th>更新时间</th>
              <th class="w-act">操作</th>
            </tr>
          </thead>
          <tbody id="prodRows"></tbody>
        </table>
        <div class="empty" id="prodEmpty" hidden>没有匹配的产品</div>
      </div>

      <div class="pager" id="prodPager"></div>
    </section>

    <!-- ---------- CONTENT ---------- -->
    <section class="view" id="view-content" hidden>
      <p class="hint">这里的修改会覆盖网站上的对应文案（分英文 / 繁体中文两套）。留空表示使用默认文案。</p>
      <div id="contentList" class="clist"></div>
    </section>

    <!-- ---------- INQUIRIES ---------- -->
    <section class="view" id="view-inquiries" hidden>
      <div class="bar">
        <div class="search">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="7" cy="7" r="4.6"/><path d="M10.6 10.6 14 14"/></svg>
          <input type="search" id="inqSearch" placeholder="搜索姓名 / 公司 / 邮箱 / 内容">
        </div>
        <button class="btn btn--ghost" id="exportInq">导出 CSV</button>
      </div>
      <div class="tblwrap">
        <table class="tbl">
          <thead>
            <tr><th class="w-dot"></th><th>姓名</th><th>公司</th><th>邮箱</th><th>主题</th><th>时间</th><th class="w-act">操作</th></tr>
          </thead>
          <tbody id="inqRows"></tbody>
        </table>
        <div class="empty" id="inqEmpty" hidden>还没有收到询盘</div>
      </div>
    </section>
  </main>
</div>

<!-- ============ PRODUCT MODAL ============ -->
<div class="modal" id="prodModal" hidden>
  <div class="modal__in">
    <header class="modal__hd">
      <h3 id="prodModalTitle">新增产品</h3>
      <button class="modal__x" id="prodClose">&times;</button>
    </header>
    <div class="modal__bd">
      <div class="grid2">
        <label class="fld"><span>型号 Part number *</span><input id="pModel" required></label>
        <label class="fld"><span>分类 Category</span><select id="pCat" class="sel"></select></label>
        <label class="fld"><span>子类型 Key</span><select id="pKind" class="sel"></select></label>
        <label class="fld"><span>封装 Package</span><input id="pPkg"></label>
        <label class="fld"><span>价格 Price (USD)</span><input id="pPrice" placeholder="0.85"></label>
        <label class="fld"><span>状态 Status</span>
          <select id="pStatus" class="sel"><option value="stock">现货 In stock</option><option value="build">按单生产 Build to order</option></select>
        </label>
      </div>

      <label class="fld"><span>关键参数摘要 Key specs</span><input id="pKey" placeholder="SOT23-6 · 1 · 4.75-23V"></label>

      <label class="fld">
        <span>规格参数（每行一条：参数键=值，键名取自该子类型的筛选项）</span>
        <textarea id="pSpecs" rows="7" placeholder="package_spec=SOT23-6&#10;input_voltage=4.75-23V&#10;output_voltage=1.0-17V"></textarea>
      </label>
      <p class="fld__help" id="pSpecsHelp"></p>

      <div class="grid2">
        <label class="fld"><span>产品图片</span>
          <input type="file" id="pImage" accept="image/*">
        </label>
        <label class="fld"><span>规格书链接（可选）</span><input id="pDs" placeholder="datasheets/xxx.pdf"></label>
      </div>
      <div class="thumb-preview"><img id="pPreview" alt=""><span id="pPreviewTip">未选择图片</span></div>

      <label class="fld"><span>备注 Remarks</span><input id="pRemarks"></label>
    </div>
    <footer class="modal__ft">
      <button class="btn btn--ghost" id="prodCancel">取消</button>
      <button class="btn btn--primary" id="prodSave">保存</button>
    </footer>
  </div>
</div>

<!-- ============ INQUIRY MODAL ============ -->
<div class="modal" id="inqModal" hidden>
  <div class="modal__in modal__in--sm">
    <header class="modal__hd">
      <h3>询盘详情</h3>
      <button class="modal__x" id="inqClose">&times;</button>
    </header>
    <div class="modal__bd" id="inqDetail"></div>
    <footer class="modal__ft">
      <button class="btn btn--ghost" id="inqDelete">删除</button>
      <a class="btn btn--primary" id="inqReply" href="#">邮件回复</a>
    </footer>
  </div>
</div>

<script src="assets/js/catalog-data.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/cms-config.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/admin.js"></script>
</body>
</html>
