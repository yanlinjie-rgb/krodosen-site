<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
  <defs>
    <linearGradient id="cBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E3280"/><stop offset="1" stop-color="#141633"/>
    </linearGradient>
    <linearGradient id="cPin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F1F4F8"/><stop offset="1" stop-color="#B4BCCA"/>
