<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
  <defs>
    <linearGradient id="mBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#33377E"/><stop offset="1" stop-color="#181B45"/>
    </linearGradient>
    <linearGradient id="mSilver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F6F9"/><stop offset=".45" stop-color="#D3D9E2"/>
      <stop offset="1" stop-color="#AEB6C4"/>
    </linearGradient>
    <pattern id="mDots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#D9DDE4"/>
    </pattern>
  </defs>

  <rect width="640" height="480" fill="url(#mDots)" opacity=".55"/>

  <!-- multilayer stack hint -->
  <g opacity=".28">
    <rect x="150" y="120" width="330" height="150" rx="14" fill="#8E96A6" transform="rotate(-11 315 195) translate(0 46)"/>
    <rect x="150" y="120" width="330" height="150" rx="14" fill="#8E96A6" transform="rotate(-11 315 195) translate(0 30)"/>
    <rect x="150" y="120" width="330" height="150" rx="14" fill="#8E96A6" transform="rotate(-11 315 195) translate(0 15)"/>
  </g>

  <!-- main capacitor (top view) -->
  <g transform="rotate(-11 315 215)">
    <rect x="150" y="145" width="330" height="150" rx="14" fill="url(#mBody)"/>
    <!-- internal electrodes -->
    <g stroke="#4B50A0" stroke-width="1.2" opacity=".65">
      <line x1="205" y1="152" x2="425" y2="152"/>
      <line x1="205" y1="166" x2="425" y2="166"/>
      <line x1="205" y1="180" x2="425" y2="180"/>
      <line x1="205" y1="194" x2="425" y2="194"/>
      <line x1="205" y1="208" x2="425" y2="208"/>
      <line x1="205" y1="222" x2="425" y2="222"/>
      <line x1="205" y1="236" x2="425" y2="236"/>
      <line x1="205" y1="250" x2="425" y2="250"/>
      <line x1="205" y1="264" x2="425" y2="264"/>
      <line x1="205" y1="278" x2="425" y2="278"/>
    </g>
    <!-- terminals -->
    <path d="M150 159 a14 14 0 0 1 14-14 h34 v150 h-34 a14 14 0 0 1-14-14z" fill="url(#mSilver)"/>
    <path d="M480 159 a14 14 0 0 0-14-14 h-34 v150 h34 a14 14 0 0 0 14-14z" fill="url(#mSilver)"/>
    <rect x="150" y="145" width="330" height="150" rx="14" fill="none" stroke="#0F1130" stroke-opacity=".28"/>
  </g>

  <!-- dimension callout -->
  <g stroke="#E8501F" stroke-width="1" fill="none" opacity=".9">
    <line x1="168" y1="360" x2="500" y2="295"/>
    <line x1="168" y1="352" x2="168" y2="368"/>
    <line x1="500" y1="287" x2="500" y2="303"/>
  </g>
  <text x="310" y="352" font-family="ui-monospace, Menlo, monospace" font-size="12"
        fill="#E8501F" letter-spacing="1.5" transform="rotate(-10 310 352)">0402 · 1.0 × 0.5 mm</text>

  <!-- layer count marker -->
  <g fill="#1E2153" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="1">
    <text x="64" y="104">D I E L E C T R I C</text>
    <text x="64" y="122" fill="#6B7280">Ni electrode × 320 layers</text>
  </g>
  <line x1="64" y1="86" x2="178" y2="86" stroke="#E8501F" stroke-width="1.5"/>
  <circle cx="546" cy="392" r="4" fill="#00A9C1"/>
  <circle cx="566" cy="392" r="4" fill="#F0A818"/>
  <circle cx="586" cy="392" r="4" fill="#E8501F"/>
</svg>
