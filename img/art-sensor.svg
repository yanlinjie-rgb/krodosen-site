<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
  <defs>
    <radialGradient id="sRing" cx=".38" cy=".3" r=".85">
      <stop offset="0" stop-color="#3B3F8C"/><stop offset="1" stop-color="#181B45"/>
    </radialGradient>
    <linearGradient id="sMetal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2F5F8"/><stop offset=".5" stop-color="#CDD4DE"/>
      <stop offset="1" stop-color="#A9B2C1"/>
    </linearGradient>
    <pattern id="sDots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#D9DDE4"/>
    </pattern>
  </defs>

  <rect width="640" height="480" fill="url(#sDots)" opacity=".55"/>

  <!-- waveform -->
  <path d="M40 300 q26 -58 52 0 t52 0 t52 0 t52 0"
        fill="none" stroke="#00A9C1" stroke-width="1.6" opacity=".45"/>
  <path d="M40 336 q26 -40 52 0 t52 0 t52 0 t52 0"
        fill="none" stroke="#00A9C1" stroke-width="1.6" opacity=".22"/>

  <!-- sensor can -->
  <g>
    <circle cx="392" cy="216" r="128" fill="url(#sRing)"/>
    <circle cx="392" cy="216" r="128" fill="none" stroke="#0F1130" stroke-opacity=".3"/>
    <circle cx="392" cy="216" r="104" fill="none" stroke="url(#sMetal)" stroke-width="9"/>
    <circle cx="392" cy="216" r="84" fill="#12142F"/>
    <circle cx="392" cy="216" r="60" fill="none" stroke="#3C419A" stroke-width="1" stroke-dasharray="3 5"/>
    <circle cx="392" cy="216" r="34" fill="#1B1E4C" stroke="#4A50A8" stroke-width="1"/>
    <!-- die -->
    <rect x="376" y="200" width="32" height="32" rx="3" fill="url(#sMetal)"/>
    <circle cx="392" cy="216" r="7" fill="#E8501F"/>
    <!-- pads -->
    <g fill="url(#sMetal)">
      <rect x="368" y="330" width="16" height="26" rx="2"/>
      <rect x="392" y="332" width="16" height="24" rx="2"/>
      <rect x="416" y="330" width="16" height="26" rx="2"/>
    </g>
    <!-- reflection -->
    <path d="M300 138 a116 116 0 0 1 74 -34" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- pin callout -->
  <g stroke="#E8501F" stroke-width="1" fill="none">
    <line x1="264" y1="330" x2="196" y2="368"/>
    <circle cx="264" cy="330" r="2.5" fill="#E8501F" stroke="none"/>
  </g>
  <text x="96" y="392" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#6B7280" letter-spacing="1">VCC · GND · OUT</text>

  <g fill="#1E2153" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="1">
    <text x="64" y="104">H A L L   S E N S O R</text>
    <text x="64" y="122" fill="#6B7280">SOT-23 · AEC-Q200</text>
  </g>
  <line x1="64" y1="86" x2="216" y2="86" stroke="#E8501F" stroke-width="1.5"/>
</svg>
