<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img" aria-label="QFN package outline">
  <defs>
    <linearGradient id="qfnBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A3F96"/><stop offset=".55" stop-color="#232760"/><stop offset="1" stop-color="#141633"/>
    </linearGradient>
    <linearGradient id="qfnPin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F6FA"/><stop offset="1" stop-color="#AEB7C6"/>
    </linearGradient>
    <linearGradient id="qfnPad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E2E7EF"/><stop offset="1" stop-color="#9EA8B8"/>
    </linearGradient>
    <linearGradient id="qfnSheen" x1="0" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".16"/><stop offset=".6" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="qfnHatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="9" stroke="#8D97A8" stroke-width="1.1" opacity=".5"/>
    </pattern>
    <pattern id="qfnDots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#D9DDE4"/>
    </pattern>
  </defs>

  <rect width="640" height="480" fill="url(#qfnDots)" opacity=".55"/>

  <g stroke="#C9CFDA" stroke-width="1.4" fill="none" opacity=".9">
    <path d="M318 100 V52 H150"/>
    <path d="M318 354 H130 V300"/>
    <path d="M456 240 H556 V150"/>
    <path d="M454 100 H520 V66"/>
  </g>
  <g fill="#C9CFDA">
    <circle cx="150" cy="52" r="3"/><circle cx="130" cy="300" r="3"/>
    <circle cx="556" cy="150" r="3"/><circle cx="520" cy="66" r="3"/>
  </g>

  <ellipse cx="330" cy="368" rx="182" ry="18" fill="#0F1030" opacity=".07"/>

  <!-- perimeter pads, 7 per side -->
  <g fill="url(#qfnPin)">
    <rect x="248" y="100" width="12" height="24" rx="2"/><rect x="274" y="100" width="12" height="24" rx="2"/>
    <rect x="300" y="100" width="12" height="24" rx="2"/><rect x="326" y="100" width="12" height="24" rx="2"/>
    <rect x="352" y="100" width="12" height="24" rx="2"/><rect x="378" y="100" width="12" height="24" rx="2"/>
    <rect x="404" y="100" width="12" height="24" rx="2"/>
    <rect x="248" y="346" width="12" height="24" rx="2"/><rect x="274" y="346" width="12" height="24" rx="2"/>
    <rect x="300" y="346" width="12" height="24" rx="2"/><rect x="326" y="346" width="12" height="24" rx="2"/>
    <rect x="352" y="346" width="12" height="24" rx="2"/><rect x="378" y="346" width="12" height="24" rx="2"/>
    <rect x="404" y="346" width="12" height="24" rx="2"/>
    <rect x="180" y="146" width="24" height="12" rx="2"/><rect x="180" y="172" width="24" height="12" rx="2"/>
    <rect x="180" y="198" width="24" height="12" rx="2"/><rect x="180" y="224" width="24" height="12" rx="2"/>
    <rect x="180" y="250" width="24" height="12" rx="2"/><rect x="180" y="276" width="24" height="12" rx="2"/>
    <rect x="180" y="302" width="24" height="12" rx="2"/>
    <rect x="456" y="146" width="24" height="12" rx="2"/><rect x="456" y="172" width="24" height="12" rx="2"/>
    <rect x="456" y="198" width="24" height="12" rx="2"/><rect x="456" y="224" width="24" height="12" rx="2"/>
    <rect x="456" y="250" width="24" height="12" rx="2"/><rect x="456" y="276" width="24" height="12" rx="2"/>
    <rect x="456" y="302" width="24" height="12" rx="2"/>
  </g>

  <!-- body, chamfered pin-1 corner -->
  <g>
    <path d="M218 118 H446 V346 H204 V132 Z" fill="url(#qfnBody)"/>
    <path d="M218 118 H446 V346 H204 V132 Z" fill="url(#qfnSheen)"/>
    <path d="M218 118 H446 V346 H204 V132 Z" fill="none" stroke="#4B51A6" stroke-width="1.5" opacity=".7"/>
    <rect x="256" y="164" width="138" height="136" rx="4" fill="url(#qfnPad)"/>
    <rect x="256" y="164" width="138" height="136" rx="4" fill="url(#qfnHatch)"/>
    <rect x="256" y="164" width="138" height="136" rx="4" fill="none" stroke="#7F8999" stroke-width="1"/>
    <circle cx="222" cy="136" r="5.5" fill="#E8501F"/>
  </g>

  <line x1="64" y1="390" x2="188" y2="390" stroke="#E8501F" stroke-width="1.5"/>
  <g fill="#1E2153" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="1">
    <text x="64" y="419">Q F N   P A C K A G E</text>
    <text x="64" y="438" fill="#6B7280" font-size="10.5">Quad flat no-lead · exposed thermal pad</text>
  </g>
</svg>
