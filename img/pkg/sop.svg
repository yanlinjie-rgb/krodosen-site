<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img" aria-label="SOP package outline">
  <defs>
    <linearGradient id="sopBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A3F96"/><stop offset=".55" stop-color="#232760"/><stop offset="1" stop-color="#141633"/>
    </linearGradient>
    <linearGradient id="sopPin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F6FA"/><stop offset="1" stop-color="#AEB7C6"/>
    </linearGradient>
    <linearGradient id="sopSheen" x1="0" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".16"/><stop offset=".6" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="sopDots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#D9DDE4"/>
    </pattern>
  </defs>

  <rect width="640" height="480" fill="url(#sopDots)" opacity=".55"/>

  <g stroke="#C9CFDA" stroke-width="1.4" fill="none" opacity=".9">
    <path d="M140 176 H84 V92"/>
    <path d="M140 226 H100 V318"/>
    <path d="M500 176 H556 V92"/>
    <path d="M500 226 H540 V318"/>
  </g>
  <g fill="#C9CFDA">
    <circle cx="84" cy="92" r="3"/><circle cx="100" cy="318" r="3"/>
    <circle cx="556" cy="92" r="3"/><circle cx="540" cy="318" r="3"/>
  </g>

  <ellipse cx="325" cy="368" rx="198" ry="18" fill="#0F1030" opacity=".07"/>

  <!-- four gull-wing leads each side -->
  <g fill="url(#sopPin)">
    <rect x="140" y="170" width="85" height="17" rx="3"/>
    <rect x="140" y="212" width="85" height="17" rx="3"/>
    <rect x="140" y="254" width="85" height="17" rx="3"/>
    <rect x="140" y="296" width="85" height="17" rx="3"/>
    <rect x="425" y="170" width="85" height="17" rx="3"/>
    <rect x="425" y="212" width="85" height="17" rx="3"/>
    <rect x="425" y="254" width="85" height="17" rx="3"/>
    <rect x="425" y="296" width="85" height="17" rx="3"/>
  </g>
  <g fill="#96A0B1">
    <rect x="140" y="181" width="26" height="6" rx="2"/>
    <rect x="140" y="223" width="26" height="6" rx="2"/>
    <rect x="140" y="265" width="26" height="6" rx="2"/>
    <rect x="140" y="307" width="26" height="6" rx="2"/>
    <rect x="484" y="181" width="26" height="6" rx="2"/>
    <rect x="484" y="223" width="26" height="6" rx="2"/>
    <rect x="484" y="265" width="26" height="6" rx="2"/>
    <rect x="484" y="307" width="26" height="6" rx="2"/>
  </g>

  <!-- wide body -->
  <g>
    <rect x="205" y="145" width="240" height="190" rx="7" fill="url(#sopBody)"/>
    <rect x="205" y="145" width="240" height="190" rx="7" fill="url(#sopSheen)"/>
    <rect x="205.75" y="145.75" width="238.5" height="188.5" rx="6.4" fill="none" stroke="#4B51A6" stroke-width="1.5" opacity=".7"/>
    <rect x="245" y="178" width="160" height="122" rx="4" fill="#1C1F55" stroke="#454B9B" stroke-width="1"/>
    <circle cx="225" cy="165" r="5.5" fill="#E8501F"/>
    <g font-family="ui-monospace, Menlo, monospace" letter-spacing="1.6" text-anchor="middle">
      <text x="325" y="232" fill="#8C95BC" font-size="10">KRD</text>
      <text x="325" y="252" fill="#6E77A0" font-size="9.5">LOT · A1</text>
    </g>
  </g>

  <line x1="64" y1="390" x2="188" y2="390" stroke="#E8501F" stroke-width="1.5"/>
  <g fill="#1E2153" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="1">
    <text x="64" y="419">S O P   P A C K A G E</text>
    <text x="64" y="438" fill="#6B7280" font-size="10.5">Small outline · dual-row gull-wing leads</text>
  </g>
</svg>
