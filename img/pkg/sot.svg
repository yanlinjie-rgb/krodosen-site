<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img" aria-label="SOT package outline">
  <defs>
    <linearGradient id="sotBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A3F96"/><stop offset=".55" stop-color="#232760"/><stop offset="1" stop-color="#141633"/>
    </linearGradient>
    <linearGradient id="sotPin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F6FA"/><stop offset="1" stop-color="#AEB7C6"/>
    </linearGradient>
    <linearGradient id="sotSheen" x1="0" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".16"/><stop offset=".6" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="sotDots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#D9DDE4"/>
    </pattern>
  </defs>

  <rect width="640" height="480" fill="url(#sotDots)" opacity=".55"/>

  <!-- board traces -->
  <g stroke="#C9CFDA" stroke-width="1.4" fill="none" opacity=".9">
    <path d="M168 170 H104 V96"/>
    <path d="M482 170 H548 V96"/>
    <path d="M168 238 H96 V320"/>
    <path d="M482 238 H552 V320"/>
  </g>
  <g fill="#C9CFDA">
    <circle cx="104" cy="96" r="3"/><circle cx="548" cy="96" r="3"/>
    <circle cx="96" cy="320" r="3"/><circle cx="552" cy="320" r="3"/>
  </g>

  <ellipse cx="325" cy="374" rx="172" ry="18" fill="#0F1030" opacity=".07"/>

  <!-- gull-wing leads -->
  <g fill="url(#sotPin)">
    <rect x="168" y="160" width="78" height="20" rx="3"/>
    <rect x="168" y="228" width="78" height="20" rx="3"/>
    <rect x="168" y="296" width="78" height="20" rx="3"/>
    <rect x="404" y="160" width="78" height="20" rx="3"/>
    <rect x="404" y="228" width="78" height="20" rx="3"/>
    <rect x="404" y="296" width="78" height="20" rx="3"/>
  </g>
  <g fill="#96A0B1">
    <rect x="168" y="173" width="26" height="7" rx="2"/>
    <rect x="168" y="241" width="26" height="7" rx="2"/>
    <rect x="168" y="309" width="26" height="7" rx="2"/>
    <rect x="456" y="173" width="26" height="7" rx="2"/>
    <rect x="456" y="241" width="26" height="7" rx="2"/>
    <rect x="456" y="309" width="26" height="7" rx="2"/>
  </g>

  <!-- body -->
  <g>
    <rect x="225" y="130" width="200" height="225" rx="8" fill="url(#sotBody)"/>
    <rect x="225" y="130" width="200" height="225" rx="8" fill="url(#sotSheen)"/>
    <rect x="225.75" y="130.75" width="198.5" height="223.5" rx="7.4" fill="none" stroke="#4B51A6" stroke-width="1.5" opacity=".7"/>
    <rect x="258" y="170" width="134" height="146" rx="4" fill="#1C1F55" stroke="#454B9B" stroke-width="1"/>
    <circle cx="243" cy="148" r="5.5" fill="#E8501F"/>
    <g font-family="ui-monospace, Menlo, monospace" letter-spacing="1.6" text-anchor="middle">
      <text x="325" y="236" fill="#8C95BC" font-size="10">KRD</text>
      <text x="325" y="256" fill="#6E77A0" font-size="9.5">LOT · A1</text>
    </g>
  </g>

  <!-- annotation -->
  <line x1="64" y1="390" x2="188" y2="390" stroke="#E8501F" stroke-width="1.5"/>
  <g fill="#1E2153" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="1">
    <text x="64" y="419">S O T   P A C K A G E</text>
    <text x="64" y="438" fill="#6B7280" font-size="10.5">Gull-wing leads · small outline transistor</text>
  </g>
</svg>
