<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img" aria-label="TO package outline">
  <defs>
    <linearGradient id="toBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A3F96"/><stop offset=".55" stop-color="#232760"/><stop offset="1" stop-color="#141633"/>
    </linearGradient>
    <linearGradient id="toPin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F6FA"/><stop offset="1" stop-color="#AEB7C6"/>
    </linearGradient>
    <linearGradient id="toTab" x1="0" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#EEF1F6"/><stop offset=".5" stop-color="#C6CDD9"/><stop offset="1" stop-color="#9BA5B6"/>
    </linearGradient>
    <linearGradient id="toSheen" x1="0" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".16"/><stop offset=".6" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="toHatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="9" stroke="#8D97A8" stroke-width="1.1" opacity=".45"/>
    </pattern>
    <pattern id="toDots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#D9DDE4"/>
    </pattern>
  </defs>

  <rect width="640" height="480" fill="url(#toDots)" opacity=".55"/>

  <g stroke="#C9CFDA" stroke-width="1.4" fill="none" opacity=".9">
    <path d="M370 112 V44 H200"/>
    <path d="M240 360 H132 V300"/>
    <path d="M500 360 H556 V300"/>
    <path d="M494 190 H560 V120"/>
  </g>
  <g fill="#C9CFDA">
    <circle cx="200" cy="44" r="3"/><circle cx="132" cy="300" r="3"/>
    <circle cx="556" cy="300" r="3"/><circle cx="560" cy="120" r="3"/>
  </g>

  <ellipse cx="370" cy="392" rx="190" ry="18" fill="#0F1030" opacity=".07"/>

  <!-- exposed heat tab -->
  <g>
    <rect x="258" y="112" width="224" height="140" rx="6" fill="url(#toTab)"/>
    <rect x="258" y="112" width="224" height="140" rx="6" fill="url(#toHatch)"/>
    <rect x="258.75" y="112.75" width="222.5" height="138.5" rx="5.4" fill="none" stroke="#8C96A7" stroke-width="1.2"/>
  </g>

  <!-- leads -->
  <g fill="url(#toPin)">
    <rect x="284" y="300" width="20" height="72" rx="2"/>
    <rect x="322" y="300" width="20" height="72" rx="2"/>
    <rect x="360" y="300" width="20" height="72" rx="2"/>
    <rect x="398" y="300" width="20" height="72" rx="2"/>
    <rect x="436" y="300" width="20" height="72" rx="2"/>
  </g>
  <g fill="#96A0B1">
    <rect x="278" y="358" width="32" height="10" rx="2"/>
    <rect x="316" y="358" width="32" height="10" rx="2"/>
    <rect x="354" y="358" width="32" height="10" rx="2"/>
    <rect x="392" y="358" width="32" height="10" rx="2"/>
    <rect x="430" y="358" width="32" height="10" rx="2"/>
  </g>

  <!-- moulded body -->
  <g>
    <rect x="276" y="168" width="188" height="150" rx="6" fill="url(#toBody)"/>
    <rect x="276" y="168" width="188" height="150" rx="6" fill="url(#toSheen)"/>
    <rect x="276.75" y="168.75" width="186.5" height="148.5" rx="5.4" fill="none" stroke="#4B51A6" stroke-width="1.5" opacity=".7"/>
    <rect x="306" y="200" width="128" height="86" rx="3" fill="#1C1F55" stroke="#454B9B" stroke-width="1"/>
    <circle cx="294" cy="186" r="5.5" fill="#E8501F"/>
    <g font-family="ui-monospace, Menlo, monospace" letter-spacing="1.6" text-anchor="middle">
      <text x="370" y="238" fill="#8C95BC" font-size="10">KRD</text>
      <text x="370" y="258" fill="#6E77A0" font-size="9.5">LOT · A1</text>
    </g>
  </g>

  <line x1="64" y1="390" x2="188" y2="390" stroke="#E8501F" stroke-width="1.5"/>
  <g fill="#1E2153" font-family="ui-monospace, Menlo, monospace" font-size="11" letter-spacing="1">
    <text x="64" y="419">T O   P A C K A G E</text>
    <text x="64" y="438" fill="#6B7280" font-size="10.5">Exposed heat tab · TO-263 / TO-220 style</text>
  </g>
</svg>
